version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "dependabot"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns:
          - "github.com/sagernet/*"
          - "github.com/maxmind/*"
          - "github.com/oschwald/*"
          - "github.com/google/go-github/*"
    ignore:
      # sing-box pre-releases (beta/rc/dev) emit rule-set format version 5
      # which our pinned core v1.13.x cannot read (max v4). Skip pre-releases so
      # dependabot only proposes stable bumps.
      - dependency-name: "github.com/sagernet/sing-box"
        versions:
          - "*-dev.*"
          - "*-rc.*"
          - "*-beta.*"
          - "*-alpha.*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
