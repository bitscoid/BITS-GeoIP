name: Build
on:
  push:
    branches:
      - main
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build geoip
        env:
          NO_SKIP: true
        run: go run -v .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geoip-build
          if-no-files-found: error
          path: |
            geoip.db
            geoip-id.db
            rule-set/
