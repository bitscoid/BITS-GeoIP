name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional upstream release tag, e.g. v2026.08.0. Leave empty for latest."
        required: false
        type: string
        default: ""
      force:
        description: Force rebuild (ignore already-latest skip)
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 8 12 * *"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build geoip
        id: build
        run: go run -v .
        env:
          FIXED_RELEASE: ${{ inputs.tag }}
          NO_SKIP: ${{ inputs.force }}

      - name: Package rule sets
        if: steps.build.outputs.skip != 'true'
        run: |
          cd rule-set && zip -r ../geoip-rule-set.zip . && cd ..
      - name: Generate sha256 hash
        if: steps.build.outputs.skip != 'true'
        run: |
          sha256sum geoip.db > geoip.db.sha256sum
          sha256sum geoip-min.db > geoip-min.db.sha256sum
          sha256sum geoip-rule-set.zip > geoip-rule-set.zip.sha256sum
      - name: Generate sha256 hash for minimal rule sets
        if: steps.build.outputs.skip != 'true'
        run: |
          cd rule-set && sha256sum geoip-id.srs > minimal.sha256sum && cd ..
      - name: Push rule-set branch
        if: steps.build.outputs.skip != 'true'
        uses: ./.github/actions/push-branch
        with:
          branch: rule-set
          files: |
            rule-set
            geoip-rule-set.zip
            geoip-rule-set.zip.sha256sum
      - name: Push release branch
        if: steps.build.outputs.skip != 'true'
        uses: ./.github/actions/push-branch
        with:
          branch: release
          files: |
            geoip.db
            geoip.db.sha256sum
            geoip-min.db
            geoip-min.db.sha256sum
      - uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.build.outputs.skip != 'true'
        with:
          keep_latest: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release geoip
        if: steps.build.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          files: |
            geoip.db
            geoip.db.sha256sum
            geoip-min.db
            geoip-min.db.sha256sum
            geoip-rule-set.zip
            geoip-rule-set.zip.sha256sum
            rule-set/geoip-id.srs
            rule-set/minimal.sha256sum
