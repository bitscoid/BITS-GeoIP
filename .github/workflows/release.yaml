name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag version you want to build"
  schedule:
    - cron: "0 8 12 * *"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build geoip
        id: build
        run: go run -v .
        env:
          FIXED_RELEASE: ${{ inputs.tag }}

      - name: Generate sha256 hash
        if: steps.build.outputs.skip != 'true'
        run: |
          sha256sum geoip.db > geoip.db.sha256sum
          sha256sum geoip-id.db > geoip-id.db.sha256sum
          tar czf rule-set.tar.gz rule-set

      - name: Push rule-set branch
        if: steps.build.outputs.skip != 'true'
        uses: ./.github/actions/push-branch
        with:
          branch: rule-set
          files: |
            rule-set
            rule-set.tar.gz

      - name: Push release branch
        if: steps.build.outputs.skip != 'true'
        uses: ./.github/actions/push-branch
        with:
          branch: release
          files: |
            geoip.db
            geoip.db.sha256sum
            geoip-id.db
            geoip-id.db.sha256sum

      - name: Delete older releases
        if: steps.build.outputs.skip != 'true'
        uses: dev-drprasad/delete-older-releases@v0.3.5
        with:
          keep_latest: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release geoip
        if: steps.build.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          files: |
            geoip.db
            geoip.db.sha256sum
            geoip-id.db
            geoip-id.db.sha256sum
            rule-set.tar.gz
